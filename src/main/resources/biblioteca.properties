# Configuracao da instalacao (pode ser sobrescrita com -Dchave=valor ou variavel de ambiente CHAVE_EM_MAIUSCULAS)

# teste = familia em memoria | producao = familia relacional (MySQL)
biblioteca.perfil=teste

# Banco de cobranca usado pela instalacao: A ou B
biblioteca.banco=A

# Politica de multa inicial: ORIGINAL | TETO | TOLERANCIA
biblioteca.politicaMulta=ORIGINAL

# Decoradores da consulta ao acervo
biblioteca.consulta.cache=true
biblioteca.consulta.medicao=true

# Banco relacional principal (somente perfil producao). O Oracle e replica: a aplicacao nao grava nele.
biblioteca.db.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&serverTimezone=UTC
biblioteca.db.usuario=root
biblioteca.db.senha=
